<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KWKMA — Student ID Card Generator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- FontAwesome (used by button icons inside id-card.js) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- Fav -->
    <link rel="shortcut icon" href="./images/fav.png" type="image/x-icon" />

    <link rel="stylesheet" href="./css/id-card.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="top-left">
        <button type="button" class="back-btn" id="backBtn">
          <i class="fa-solid fa-arrow-left"></i>
          Back
        </button>

        <div>
          <div class="page-label">KWKMA</div>

          <h1>STUDENT ID CARD GENERATOR</h1>
        </div>
      </div>

      <div class="top-right">
        <div class="system-status">
          <span></span>

          Firebase Connected
        </div>
      </div>
    </header>

    <main class="layout">
      <!-- LEFT: lookup panel -->
      <section class="panel form-panel">
        <h2>রেজিস্ট্রেশন নম্বর দিন</h2>
        <p class="hint">
          Registration No. আর Validity দিয়ে Generate করুন — student এর তথ্য অটো
          লোড হয়ে card এ বসে যাবে।
        </p>

        <label class="field-label" for="registrationInput"
          >Registration No.</label
        >
        <div class="reg-input-group">
          <span class="reg-prefix">KWKMA-</span>
          <input
            type="text"
            id="registrationInput"
            placeholder="যেমন: 0125"
            inputmode="numeric"
            autocomplete="off"
          />
        </div>

        <label class="field-label" for="validityInput" style="margin-top: 16px">
          Validity
        </label>
        <input
          type="text"
          id="validityInput"
          class="text-input"
          placeholder="যেমন: 31/12/2026"
          autocomplete="off"
        />

        <div class="btn-row">
          <button id="generateBtn" class="btn btn-primary" type="button">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            Generate ID Card
          </button>
          <button id="resetBtn" class="btn btn-ghost" type="button">
            Reset
          </button>
        </div>

        <p id="messageBox" class="message-box hidden"></p>
      </section>

      <!-- RIGHT: card preview -->
      <section id="previewSection" class="panel preview-panel hidden">
        <div class="cards-row">
          <div class="card-preview-wrap">
            <div class="card-scaler">
              <div id="idCardFront"></div>
            </div>
          </div>
          <div class="card-preview-wrap">
            <div class="card-scaler">
              <div id="idCardBack"></div>
            </div>
          </div>
        </div>

        <div class="btn-row download-row">
          <button id="downloadPngBtn" class="btn btn-download" type="button">
            <i class="fa-solid fa-image"></i>
            Download PNG
          </button>
          <button id="downloadPdfBtn" class="btn btn-download" type="button">
            <i class="fa-solid fa-file-pdf"></i>
            Download PDF
          </button>
        </div>
        <p class="hint small">
          প্রতিটা card 2.3654" × 3.6252" (710 × 1088 px) — সাইজ/রেশিও সবসময়
          ফিক্সড।
        </p>
      </section>
    </main>

    <!-- Libraries required by js/id-card.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Your existing advanced ID card logic -->
    <script type="module" src="./js/id-card.js"></script>
  </body>
</html>
